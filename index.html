//================ 7. 节点 DOM 渲染 ================
function createNodeElement(node) {
  const el = document.createElement('div');
  el.className = 'node';
  el.dataset.id = node.id;
  el.dataset.type = node.type;
  el.style.left = node.x + 'px';
  el.style.top = node.y + 'px';
  el.style.zIndex = (++workflow.nextZ).toString();
  el.style.setProperty('--type-color', node.def.color);

  // 关闭按钮
  const closeBtn = document.createElement('button');
  closeBtn.className = 'node-close-btn';
  closeBtn.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4l8 8M12 4l-8 8"/></svg>';
  closeBtn.onclick = (e) => { e.stopPropagation(); deleteNode(node.id); };

  // 标题栏
  const header = document.createElement('div');
  header.className = 'node-header';
  const statusDot = document.createElement('div');
  statusDot.className = 'node-status-dot idle';
  const titleText = document.createElement('div');
  titleText.className = 'node-title-text';
  titleText.textContent = node.title;
  header.appendChild(statusDot);
  header.appendChild(titleText);
  header.appendChild(closeBtn);

  el.appendChild(header);

  // 设置宽度
  el.style.width = node.width + 'px';

  // 构建 body
  buildNodeBody(el, node);

  // 缩放手柄 (右下角)
  const resizeHandle = document.createElement('div');
  resizeHandle.className = 'node-resize-handle';
  resizeHandle.addEventListener('mousedown', (e) => {
    e.stopPropagation();
    e.preventDefault();
    startNodeResize(e, node);
  });
  el.appendChild(resizeHandle);

  // 节点拖拽
  el.addEventListener('mousedown', (e) => {
    if (e.target.closest('button, input, textarea, select, .node-port, .node-resize-handle')) return;
    if (e.button !== 0) return;
    // Ctrl/Cmd+点击 -> 切换选中；Shift+点击 -> 追加选中
    if (e.ctrlKey || e.metaKey) {
      if (workflow.selection.has(node.id)) {
        setNodeSelected(node, false);
        return; // 取消选中时直接返回，不进入拖拽
      }
      setNodeSelected(node, true);
    } else if (!e.shiftKey) {
      if (!workflow.selection.has(node.id)) selectNode(node);
    }
    startNodeDrag(e, node);
  });

  node.el = el;
  return el;
}

function buildNodeBody(el, node) {
  // 移除旧的 body / preset-row / controls / toolbar / ports
  el.querySelectorAll('.node-body, .node-preset-row, .node-controls, .node-toolbar, .node-port')
    .forEach(n => n.remove());

  const def = node.def;
  const hasPrompt = ['aiImage', 'aiVideo'].includes(node.type);
  const hasThumb = ['image', 'aiImage', 'aiVideo', 'upscale', 'compare', 'save'].includes(node.type);
  const hasControls = ['aiImage', 'aiVideo'].includes(node.type);
  const hasToolbar = ['image', 'aiImage', 'aiVideo', 'upscale'].includes(node.type);

  // —— body: 缩略图 + 提示词 ——
  if (hasThumb || hasPrompt) {
    const body = document.createElement('div');
    body.className = 'node-body';

    if (hasThumb) {
      const thumbRow = document.createElement('div');
      thumbRow.className = 'node-thumb-row';

      // 缩略图
      if (node.thumb) {
        const thumb = document.createElement('div');
        thumb.className = 'node-thumb';
        thumb.innerHTML = `<img src="${node.thumb}" alt="">`;
        thumbRow.appendChild(thumb);
      } else {
        const empty = document.createElement('div');
        empty.className = 'node-thumb-empty';
        empty.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3v10M3 8h10"/></svg>';
        empty.onclick = (e) => {
          e.stopPropagation();
          if (node.type === 'image' || node.type === 'upscale') {
            openImageUpload(node);
          } else {
            node.thumb = makePlaceholder(node.type, node.id);
            buildNodeBody(el, node);
            markEdgesDirty();
            scheduleAutosave();
          }
        };
        empty.onmousedown = (e) => e.stopPropagation();
        thumbRow.appendChild(empty);
      }

      // 提示词 (AI 类型)
      if (hasPrompt) {
        const promptArea = document.createElement('div');
        promptArea.className = 'node-prompt-area';
        const textarea = document.createElement('textarea');
        textarea.className = 'node-textarea';
        textarea.placeholder = '输入提示词...';
        textarea.value = node.prompt;
        textarea.rows = 2;
        textarea.oninput = (e) => { node.prompt = e.target.value; scheduleAutosave(); };
        textarea.onmousedown = (e) => e.stopPropagation();
        promptArea.appendChild(textarea);
        thumbRow.appendChild(promptArea);
      }

      body.appendChild(thumbRow);
    } else if (node.type === 'text') {
      // 纯文本节点
      const textarea = document.createElement('textarea');
      textarea.className = 'node-textarea';
      textarea.placeholder = '输入文本内容...';
      textarea.value = node.prompt;
      textarea.rows = 4;
      textarea.style.minHeight = '60px';
      textarea.oninput = (e) => { node.prompt = e.target.value; scheduleAutosave(); };
      textarea.onmousedown = (e) => e.stopPropagation();
      body.appendChild(textarea);
    }

    el.appendChild(body);
  }

  // —— 常用提示词 chip 行 ——
  if (hasPrompt) {
    const presetRow = document.createElement('div');
    presetRow.className = 'node-preset-row';
    const presets = ['写实风格', '动漫风', '油画质感'];
    presets.forEach(text => {
      const chip = document.createElement('button');
      chip.className = 'node-preset-chip';
      chip.innerHTML = `<span class="preset-arrow">›</span>${text}`;
      chip.onclick = (e) => {
        e.stopPropagation();
        node.prompt = (node.prompt ? node.prompt + '，' : '') + text;
        const ta = el.querySelector('.node-textarea');
        if (ta) ta.value = node.prompt;
        scheduleAutosave();
      };
      chip.onmousedown = (e) => e.stopPropagation();
      presetRow.appendChild(chip);
    });
    el.appendChild(presetRow);
  }

  // —— 控件行 ——
  if (hasControls) {
    const controls = document.createElement('div');
    controls.className = 'node-controls';

    // 模型下拉
    const modelSel = document.createElement('select');
    modelSel.className = 'model-select';
    const models = node.type === 'aiImage'
      ? ['Nano Banana Pro', 'FLUX.1', 'Stable Diffusion XL']
      : ['Sora 2', 'Veo 3', '可灵 2.0'];
    models.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m;
      opt.textContent = m;
      modelSel.appendChild(opt);
    });
    modelSel.value = node.params.model;
    modelSel.onchange = (e) => { node.params.model = e.target.value; scheduleAutosave(); };
    modelSel.onmousedown = (e) => e.stopPropagation();
    controls.appendChild(modelSel);

    // 参数 chips
    const paramOptions = {
      aspect: ['Auto', '1:1', '16:9', '9:16'],
      count: ['1张', '2张', '4张'],
      mode: ['同步', '异步']
    };
    ['aspect', 'count', 'mode'].forEach(key => {
      const chip = document.createElement('button');
      chip.className = 'param-chip';
      chip.textContent = node.params[key];
      chip.onclick = (e) => {
        e.stopPropagation();
        const list = paramOptions[key];
        const i = list.indexOf(node.params[key]);
        node.params[key] = list[(i + 1) % list.length];
        chip.textContent = node.params[key];
        scheduleAutosave();
      };
      chip.onmousedown = (e) => e.stopPropagation();
      controls.appendChild(chip);
    });

    // 执行按钮
    const runBtn = document.createElement('button');
    runBtn.className = 'run-btn';
    runBtn.innerHTML = '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2l9 6-9 6z"/></svg>';
    runBtn.title = '运行此节点';
    runBtn.onclick = (e) => { e.stopPropagation(); runNode(node); };
    runBtn.onmousedown = (e) => e.stopPropagation();
    controls.appendChild(runBtn);

    el.appendChild(controls);
  }

  // —— 底部工具栏 ——
  if (hasToolbar) {
    const toolbar = document.createElement('div');
    toolbar.className = 'node-toolbar';
    const tools = [
      { icon: 'copy', title: '复制链接' },
      { icon: 'canvas', title: '发送到画布' },
      { icon: 'chat', title: '发送到对话' },
      { icon: 'storyboard', title: '发送到分镜' }
    ];
    tools.forEach(t => {
      const btn = document.createElement('button');
      btn.className = 'tool-btn';
      btn.innerHTML = TOOLBAR_ICONS[t.icon] || '';
      btn.title = t.title;
      btn.onclick = (e) => { e.stopPropagation(); };
      btn.onmousedown = (e) => e.stopPropagation();
      toolbar.appendChild(btn);
    });
    if (node.type === 'image' || node.type === 'upscale') {
      const upBtn = document.createElement('button');
      upBtn.className = 'tool-btn';
      upBtn.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 10V2M5 5l3-3 3 3M3 14h10"/></svg>';
      upBtn.title = '上传图片';
      upBtn.onclick = (e) => { e.stopPropagation(); openImageUpload(node); };
      upBtn.onmousedown = (e) => e.stopPropagation();
      toolbar.appendChild(upBtn);
    }
    el.appendChild(toolbar);
  }

  // —— 端口 ——
  const inputs = def.inputs || [];
  const outputs = def.outputs || [];

  // 计算端口 Y 位置：从标题栏下方开始均匀分布
  const portStartY = 48; // 标题栏底部附近
  const portSpacing = 28;

  inputs.forEach((portDef, i) => {
    const port = document.createElement('div');
    port.className = 'node-port input';
    port.style.top = (portStartY + i * portSpacing) + 'px';
    port.dataset.node = node.id;
    port.dataset.kind = 'input';
    port.dataset.portIdx = i;
    port.dataset.portType = portDef.type;
    port.title = portDef.label;
    el.appendChild(port);
  });

  outputs.forEach((portDef, i) => {
    const port = document.createElement('div');
    port.className = 'node-port output';
    port.style.top = (portStartY + i * portSpacing) + 'px';
    port.dataset.node = node.id;
    port.dataset.kind = 'output';
    port.dataset.portIdx = i;
    port.dataset.portType = portDef.type;
    port.title = portDef.label;
    el.appendChild(port);
  });

  // 更新状态指示器
  updateNodeStatus(node);

  // 同步节点实际高度（供 fitToContent 使用）
  // 元素未挂载 DOM 时 offsetHeight 为 0，此时保留 node.height 已有值，避免覆盖为 0
  node.height = el.offsetHeight || node.height;
}

function updateNodeStatus(node) {
  if (!node.el) return;
  const dot = node.el.querySelector('.node-status-dot');
  if (!dot) return;
  dot.className = 'node-status-dot ' + node.status;

  // 执行按钮状态
  const runBtn = node.el.querySelector('.run-btn');
  if (runBtn) {
    if (node.status === 'running') {
      runBtn.classList.add('running');
    } else {
      runBtn.classList.remove('running');
    }
  }
}

//================ 8. 节点 CRUD ================
function addNode(type, x, y, thumb = null) {
  pushHistory();
  const node = new WorkflowNode(type, x, y);
  if (thumb) node.thumb = thumb;
  const el = createNodeElement(node);
  nodeLayer.appendChild(el);
  workflow.nodes.set(node.id, node);
  workflow.order.push(node.id);
  selectNode(node);
  updateStatusbar();
  minimapInvalidate();
  markEdgesDirty();
  scheduleAutosave();
  return node;
}

function deleteNode(id) {
  const node = workflow.nodes.get(id);
  if (!node) return;

  // 压入历史（删除前快照）
  pushHistory();

  // 收集关联连线的快照（用于还原时恢复）
  const relatedEdges = [];
  [...workflow.edges.values()].forEach(e => {
    if (e.from.node.id === id || e.to.node.id === id) {
      relatedEdges.push({
        id: e.id,
        fromNodeId: e.from.node.id,
        fromPort: e.from.port,
        toNodeId: e.to.node.id,
        toPort: e.to.port,
      });
      workflow.edges.delete(e.id);
    }
  });

  // 将节点数据快照移入回收站
  recycleBin.push({
    node: {
      id: node.id,
      type: node.type,
      x: node.x,
      y: node.y,
      width: node.width,
      height: node.height,
      title: node.title,
      thumb: node.thumb,
      prompt: node.prompt,
      params: { ...node.params },
      status: node.status,
    },
    edges: relatedEdges,
    deletedAt: Date.now(),
  });

  // 从画布移除 DOM 和数据
  node.el.remove();
  workflow.nodes.delete(id);
  workflow.order = workflow.order.filter(nid => nid !== id);
  workflow.selection.delete(id);

  updateStatusbar();
  updateRecycleUI();
  updateSelectionUI();
  updateContextToolbar();
  minimapInvalidate();
  markEdgesDirty();
  scheduleAutosave();
  showToast('已移入回收站（可还原）', 'warn');
}

function selectNode(node) {
  workflow.selection.forEach(id => {
    const n = workflow.nodes.get(id);
    if (n && n.el) n.el.classList.remove('selected');
  });
  workflow.selection.clear();
  workflow.selection.add(node.id);
  node.el.classList.add('selected');
  node.el.style.zIndex = (++workflow.nextZ).toString();
  updateSelectionUI();
  updateContextToolbar();
}

function setNodeSelected(node, selected) {
  if (selected) {
    workflow.selection.add(node.id);
    node.el.classList.add('selected');
    node.el.style.zIndex = (++workflow.nextZ).toString();
  } else {
    workflow.selection.delete(node.id);
    node.el.classList.remove('selected');
  }
  updateSelectionUI();
  updateContextToolbar();
}

function clearSelection() {
  workflow.selection.forEach(id => {
    const n = workflow.nodes.get(id);
    if (n && n.el) n.el.classList.remove('selected');
  });
  workflow.selection.clear();
  updateSelectionUI();
  updateContextToolbar();
}

//================ 9. 节点拖拽 ================
let dragContext = null;

function startNodeDrag(e, node) {
  e.preventDefault();
  e.stopPropagation();

  const startX = e.clientX;
  const startY = e.clientY;
  const isGroup = workflow.selection.size > 1 && workflow.selection.has(node.id);
  // 组拖拽时记录所有选中节点的初始位置
  const initPos = new Map();
  if (isGroup) {
    workflow.selection.forEach(id => {
      const n = workflow.nodes.get(id);
      if (n) initPos.set(n.id, { x: n.x, y: n.y });
    });
  }
  const origX = node.x;
  const origY = node.y;
  let moved = false;
  let historyPushed = false; // lazy 压栈标记：首次移动时才压栈，捕获拖拽前状态
  node.el.classList.add('dragging');

  dragContext = { type: 'node', nodeId: node.id };

  const onMove = (e2) => {
    const dx = (e2.clientX - startX) / workflow.camera.zoom;
    const dy = (e2.clientY - startY) / workflow.camera.zoom;
    if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
      if (!historyPushed) {
        pushHistory();       // 首次移动时压栈（此时各节点 x/y 仍是拖拽前值）
        historyPushed = true;
      }
      moved = true;
    }
    if (isGroup) {
      // 整组同步移动
      initPos.forEach((pos, nid) => {
        const n = workflow.nodes.get(nid);
        if (!n || !n.el) return;
        n.x = pos.x + dx;
        n.y = pos.y + dy;
        n.el.style.left = n.x + 'px';
        n.el.style.top = n.y + 'px';
      });
    } else {
      node.x = origX + dx;
      node.y = origY + dy;
      node.el.style.left = node.x + 'px';
      node.el.style.top = node.y + 'px';
    }
    markEdgesDirty();
  };
  const onUp = () => {
    node.el.classList.remove('dragging');
    window.removeEventListener('mousemove', onMove);
    window.removeEventListener('mouseup', onUp);
    if (moved) {
      scheduleAutosave();
    }
  };
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
}

//================ 9b. 节点缩放 ================
function startNodeResize(e, node) {
  const startX = e.clientX;
  const startY = e.clientY;
  const origW = node.width;
  const origH = node.height || 200;
  const minWidth = 200;
  const maxWidth = 600;
  let moved = false;
  let historyPushed = false; // lazy 压栈标记：首次缩放时才压栈，捕获缩放前状态
  node.el.classList.add('dragging');

  const onMove = (e2) => {
    const dx = (e2.clientX - startX) / workflow.camera.zoom;
    const newWidth = Math.max(minWidth, Math.min(maxWidth, origW + dx));
    if (newWidth !== node.width) {
      if (!historyPushed) {
        pushHistory();
        historyPushed = true;
      }
      moved = true;
    }
    node.width = newWidth;
    node.el.style.width = node.width + 'px';
    // 垂直方向同时调整高度（右下角拖拽）
    const dy = (e2.clientY - startY) / workflow.camera.zoom;
    const newHeight = Math.max(80, Math.min(900, origH + dy));
    if (Math.abs(newHeight - (node.height || origH)) > 0.5) {
      if (!historyPushed) {
        pushHistory();
        historyPushed = true;
      }
      moved = true;
    }
    node.height = newHeight;
    node.el.style.minHeight = newHeight + 'px';
    // 同步实际高度（内容更高时取内容高度，供 fitToContent 使用）
    node.height = node.el.offsetHeight;
    markEdgesDirty();
  };
  const onUp = () => {
    node.el.classList.remove('dragging');
    node.height = node.el.offsetHeight;
    window.removeEventListener('mousemove', onMove);
    window.removeEventListener('mouseup', onUp);
    if (moved) {
      scheduleAutosave();
      markEdgesDirty();
    }
  };
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
}

//================ 10. 画布平移与缩放 ================
let panning = false;
let panStart = null;
let isSpacePressed = false;

canvasWrap.addEventListener('mousedown', (e) => {
  // 工具条/缩略图内部点击不触发画布逻辑（避免清空多选）
  if (e.target.closest('.context-toolbar, .canvas-minimap, .canvas-toolbar, .zoom-controls')) return;
  const isOnNode = e.target.closest('.node');
  const isOnPort = e.target.closest('.node-port');
  if (isOnNode || isOnPort) return;

  // 空格键 / 中键 → 平移
  if (e.button === 1 || (isSpacePressed && e.button === 0)) {
    panning = true;
    panStart = { x: e.clientX, y: e.clientY, camX: workflow.camera.x, camY: workflow.camera.y };
    canvasWrap.classList.add('panning');
    e.preventDefault();
  } else if (e.button === 0) {
    // 点击空白：Shift+点击不清空选择（追加模式）；否则取消选中并进入框选
    if (!e.shiftKey) clearSelection();
    startMarquee(e);
  }
});

window.addEventListener('mousemove', (e) => {
  if (panning && panStart) {
    workflow.camera.x = panStart.camX + (e.clientX - panStart.x);
    workflow.camera.y = panStart.camY + (e.clientY - panStart.y);
    applyTransform();
    markEdgesDirty();
  }
});

window.addEventListener('mouseup', () => {
  if (panning) {
    panning = false;
    panStart = null;
    canvasWrap.classList.remove('panning');
  }
  if (marquee.active) endMarquee();
});

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && !e.target.closest('input, textarea')) {
    isSpacePressed = true;
    canvasWrap.classList.add('space-down');
    e.preventDefault();
  }
  // Delete 删除选中节点
  if ((e.code === 'Delete' || e.code === 'Backspace') && !e.target.closest('input, textarea, select')) {
    workflow.selection.forEach(id => deleteNode(id));
    e.preventDefault();
  }
  // F 适应内容 / 0 重置缩放 / T 切换主题 / Ctrl+Enter 运行全部
  if (e.code === 'KeyF' && !e.target.closest('input, textarea, select')) { e.preventDefault(); fitToContent(); return; }
  if (e.code === 'Digit0' && !e.target.closest('input, textarea, select')) { e.preventDefault(); resetZoom(); return; }
  if (e.code === 'KeyT' && !e.target.closest('input, textarea, select')) { e.preventDefault(); toggleTheme(); return; }
  if (e.code === 'Enter' && (e.ctrlKey || e.metaKey) && !e.target.closest('input, textarea, select')) { e.preventDefault(); runAllNodes(); return; }
  // Ctrl+A 全选节点
  if (e.code === 'KeyA' && (e.ctrlKey || e.metaKey) && !e.target.closest('input, textarea, select')) {
    e.preventDefault();
    selectAllNodes();
  }
  // Ctrl+D 批量复制选中节点
  if (e.code === 'KeyD' && (e.ctrlKey || e.metaKey) && !e.target.closest('input, textarea, select')) {
    e.preventDefault();
    duplicateSelection();
  }
  // 方向键微调选中节点（Shift+方向键大步）
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code) && !e.target.closest('input, textarea, select')) {
    const step = e.shiftKey ? 20 : 5;
    const dx = e.code === 'ArrowLeft' ? -step : e.code === 'ArrowRight' ? step : 0;
    const dy = e.code === 'ArrowUp' ? -step : e.code === 'ArrowDown' ? step : 0;
    if (dx || dy) {
      e.preventDefault();
      nudgeSelection(dx, dy);
    }
  }
  // Ctrl+Z 撤销 (Ctrl+Shift+Z 也触发撤销 → 交给下面 redo 判断优先)
  // 注意: 输入框聚焦时不拦截，让浏览器原生行为生效
  if ((e.ctrlKey || e.metaKey) && e.code === 'KeyZ' && !e.target.closest('input, textarea, select')) {
    e.preventDefault();
    if (e.shiftKey) {
      redo();
    } else {
      undo();
    }
  }
  // Ctrl+Y 重做
  if ((e.ctrlKey || e.metaKey) && e.code === 'KeyY' && !e.target.closest('input, textarea, select')) {
    e.preventDefault();
    redo();
  }
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'Space') {
    isSpacePressed = false;
    canvasWrap.classList.remove('space-down');
  }
});

// 滚轮缩放（鼠标位置为锚点）
canvasWrap.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = canvasWrap.getBoundingClientRect();
  const sx = e.clientX - rect.left;
  const sy = e.clientY - rect.top;

  // 触控板捏合缩放（Ctrl+滚轮，常见于触控板/魔术鼠标）
  if (e.ctrlKey) {
    const factor = e.deltaY < 0 ? 1.1 : (1 / 1.1);
    workflow.camera.zoomAt(sx, sy, factor);
    applyTransform();
    markEdgesDirty();
    return;
  }
  // Shift+滚轮 / 明显的水平滚动 -> 水平平移（触控板横向滑动）
  if (e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
    const dx = e.deltaX !== 0 ? e.deltaX : e.deltaY;
    workflow.camera.panBy(-dx, 0);
    applyTransform();
    markEdgesDirty();
    return;
  }
  // 普通滚轮 -> 以光标为锚点缩放
  const factor = e.deltaY < 0 ? 1.1 : (1 / 1.1);
  workflow.camera.zoomAt(sx, sy, factor);
  applyTransform();
  markEdgesDirty();
}, { passive: false });

function applyTransform() {
  const cam = workflow.camera;
  nodeLayer.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.zoom})`;
  const pct = Math.round(cam.zoom * 100) + '%';
  document.getElementById('statZoom').textContent = pct;
  document.getElementById('zoomDisplay').textContent = pct;
  drawGrid();
  drawMinimap();
  updateVisibleNodes();
}

// 缩放控件
document.getElementById('zoomIn').onclick = () => {
  const rect = canvasWrap.getBoundingClientRect();
  workflow.camera.zoomAt(rect.width / 2, rect.height / 2, 1.2);
  applyTransform();
  markEdgesDirty();
};
document.getElementById('zoomOut').onclick = () => {
  const rect = canvasWrap.getBoundingClientRect();
  workflow.camera.zoomAt(rect.width / 2, rect.height / 2, 1 / 1.2);
  applyTransform();
  markEdgesDirty();
};
document.getElementById('zoomFit').onclick = () => fitToContent();

function fitToContent() {
  if (workflow.nodes.size === 0) {
    workflow.camera.x = canvasWrap.clientWidth / 2;
    workflow.camera.y = canvasWrap.clientHeight / 2;
    workflow.camera.zoom = 1;
    applyTransform();
    return;
  }
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  workflow.nodes.forEach(n => {
    minX = Math.min(minX, n.x);
    minY = Math.min(minY, n.y);
    maxX = Math.max(maxX, n.x + n.width);
    maxY = Math.max(maxY, n.y + n.height);
  });
  const w = maxX - minX, h = maxY - minY;
  const pad = 80;
  const availW = canvasWrap.clientWidth - pad * 2;
  const availH = canvasWrap.clientHeight - 80 - pad; // 减去状态栏和缩放控件
  const z = Math.min(availW / w, availH / h, 1.5);
  workflow.camera.zoom = Math.max(workflow.camera.MIN_ZOOM, z);
  workflow.camera.x = canvasWrap.clientWidth / 2 - (minX + w / 2) * workflow.camera.zoom;
  workflow.camera.y = (canvasWrap.clientHeight - 28) / 2 - (minY + h / 2) * workflow.camera.zoom + 14;
  applyTransform();
  markEdgesDirty();
}

//================ 11. 网格绘制 (Canvas 网点) ================
function resizeCanvases() {
  const dpr = window.devicePixelRatio || 1;
  const w = canvasWrap.clientWidth;
  const h = canvasWrap.clientHeight;

  [gridCanvas, edgeCanvas].forEach(cv => {
    cv.width = w * dpr;
    cv.height = h * dpr;
    cv.style.width = w + 'px';
    cv.style.height = h + 'px';
    cv.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
  });

  drawGrid();
  markEdgesDirty();
}

function drawGrid() {
  const ctx = gridCtx;
  const w = canvasWrap.clientWidth;
  const h = canvasWrap.clientHeight;
  const cam = workflow.camera;

  // 深色背景
  ctx.fillStyle = getCSSVar('--bg-deepest') || COLORS.bgDeepest;
  ctx.fillRect(0, 0, w, h);

  // 网点网格 — LOD 策略
  const baseSpacing = 24; // 屏幕像素基础间距
  let spacing = baseSpacing * cam.zoom;
  // 缩放越低间距越大：小于 8px 时倍增直到 ≥ 8px
  while (spacing < 8) spacing *= 2;

  const offsetX = cam.x % spacing;
  const offsetY = cam.y % spacing;

  // 网点颜色：基于 CSS 变量 --grid-line-minor 的 RGB 分量，动态调节透明度
  const alpha = cam.zoom > 1 ? 0.06 : 0.04;
  const c = parseRGB(getCSSVar('--grid-line-minor'));
  ctx.fillStyle = `rgba(${c.r}, ${c.g}, ${c.b}, ${alpha})`;

  for (let x = offsetX; x < w; x += spacing) {
    for (let y = offsetY; y < h; y += spacing) {
      ctx.fillRect(Math.round(x), Math.round(y), 1.5, 1.5);
    }
  }

  // 原点标记（世界原点 0,0 处的十字）
  const origin = cam.worldToScreen(0, 0);
  if (origin.x > -20 && origin.x < w + 20 && origin.y > -20 && origin.y < h + 20) {
    ctx.strokeStyle = getCSSVar('--grid-origin') || COLORS.gridOrigin;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(origin.x - 10, origin.y);
    ctx.lineTo(origin.x + 10, origin.y);
    ctx.moveTo(origin.x, origin.y - 10);
    ctx.lineTo(origin.x, origin.y + 10);
    ctx.stroke();
  }
}

window.addEventListener('resize', () => { resizeCanvases(); });

//================ 12. 连线绘制 (Canvas 贝塞尔) ================
let edgesDirty = false;
function markEdgesDirty() { edgesDirty = true; }

function getPortScreenPos(node, kind, idx) {
  const port = node.el.querySelector(`.node-port.${kind}[data-port-idx="${idx}"]`);
  if (!port) return { x: 0, y: 0 };
  const rect = port.getBoundingClientRect();
  const cRect = canvasWrap.getBoundingClientRect();
  return {
    x: rect.left + rect.width / 2 - cRect.left,
    y: rect.top + rect.height / 2 - cRect.top,
  };
}

function drawEdges() {
  if (!edgesDirty) return;
  edgesDirty = false;
  const ctx = edgeCtx;
  const w = canvasWrap.clientWidth;
  const h = canvasWrap.clientHeight;
  ctx.clearRect(0, 0, w, h);

  // 已建立连线
  workflow.edges.forEach(edge => {
    const fn = edge.from.node;
    const tn = edge.to.node;
    if (!fn.el || !tn.el) return;
    const fp = getPortScreenPos(fn, 'output', edge.from.port);
    const tp = getPortScreenPos(tn, 'input', edge.to.port);

    // 贝塞尔曲线 — 颜色读取自 CSS 变量, 线宽 2px
    drawBezier(ctx, fp.x, fp.y, tp.x, tp.y, getCSSVar('--color-primary') || COLORS.primary, 2);

    // 端点实心圆填充
    drawPortDot(ctx, fp.x, fp.y, getCSSVar('--color-primary') || COLORS.primary);
    drawPortDot(ctx, tp.x, tp.y, getCSSVar('--color-primary') || COLORS.primary);

    // 标记端口为 connected
    updatePortConnected(fn, 'output', edge.from.port, true);
    updatePortConnected(tn, 'input', edge.to.port, true);
  });

  // 拖拽中临时线（草稿线：虚线 + 半透明）
  if (workflow.pendingConnection) {
    const pc = workflow.pendingConnection;
    const fp = getPortScreenPos(pc.fromNode, pc.fromKind, pc.fromIdx);
    const valid = pc.valid;
    const color = valid ? (getCSSVar('--color-primary') || COLORS.primary) : (getCSSVar('--color-danger') || COLORS.danger);

    // 草稿线：虚线
    drawBezierDashed(ctx, fp.x, fp.y, pc.toX, pc.toY, color, 2);
    drawPortDot(ctx, fp.x, fp.y, color);

    // hover 端口高亮
    if (workflow.hoveredPort) {
      const hp = getPortScreenPos(workflow.hoveredPort.node, workflow.hoveredPort.kind, workflow.hoveredPort.idx);
      drawPortDot(ctx, hp.x, hp.y, valid ? (getCSSVar('--color-primary') || COLORS.primary) : (getCSSVar('--color-danger') || COLORS.danger), 6);
    }
  }
}

function drawBezier(ctx, x1, y1, x2, y2, color, width) {
  // 控制点偏移: max(50, |dx|*0.5)
  const dx = Math.max(50, Math.abs(x2 - x1) * 0.5);
  const cp1x = x1 + dx, cp1y = y1;
  const cp2x = x2 - dx, cp2y = y2;

  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, x2, y2);
  ctx.stroke();
}

function drawBezierDashed(ctx, x1, y1, x2, y2, color, width) {
  const dx = Math.max(50, Math.abs(x2 - x1) * 0.5);
  const cp1x = x1 + dx, cp1y = y1;
  const cp2x = x2 - dx, cp2y = y2;

  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.globalAlpha = 0.6;
  ctx.setLineDash([6, 4]);
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, x2, y2);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;
}

function drawPortDot(ctx, x, y, color, radius = 4) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fill();
}

function updatePortConnected(node, kind, idx, connected) {
  const port = node.el.querySelector(`.node-port.${kind}[data-port-idx="${idx}"]`);
  if (!port) return;
  if (connected) port.classList.add('connected');
  else port.classList.remove('connected');
}

//================ 13. RAF 循环 ================
function loop() {
  drawEdges();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

//================ 14. 端口拖拽连线 ================
let connecting = null;

canvasWrap.addEventListener('mousedown', (e) => {
  const portEl = e.target.closest('.node-port');
  if (!portEl) return;
  e.stopPropagation();
  e.preventDefault();

  const node = workflow.nodes.get(portEl.dataset.node);
  if (!node) return;

  connecting = {
    fromNode: node,
    fromKind: portEl.dataset.kind,
    fromIdx: parseInt(portEl.dataset.portIdx),
    fromType: portEl.dataset.portType,
  };

  // 标记起始端口为 connecting
  portEl.classList.add('connecting');

  workflow.pendingConnection = {
    fromNode: node,
    fromKind: portEl.dataset.kind,
    fromIdx: parseInt(portEl.dataset.portIdx),
    toX: e.clientX - canvasWrap.getBoundingClientRect().left,
    toY: e.clientY - canvasWrap.getBoundingClientRect().top,
    valid: false,
  };
});

window.addEventListener('mousemove', (e) => {
  if (!connecting) return;
  const rect = canvasWrap.getBoundingClientRect();
  const sx = e.clientX - rect.left;
  const sy = e.clientY - rect.top;

  const portEl = e.target.closest && e.target.closest('.node-port');
  let hovered = null, valid = false;

  // 清除之前的 compatible 标记
  workflow.nodes.forEach(n => {
    n.el.querySelectorAll('.node-port.compatible, .node-port.incompatible').forEach(p => {
      p.classList.remove('compatible', 'incompatible');
    });
  });

  if (portEl && portEl.dataset.node !== connecting.fromNode.id) {
    const toKind = portEl.dataset.kind;
    // 方向验证: output→input 或 input→output (双向)
    const isOpposite = connecting.fromKind !== toKind;
    if (isOpposite) {
      const toType = portEl.dataset.portType;
      valid = connecting.fromType === toType;
      hovered = {
        node: workflow.nodes.get(portEl.dataset.node),
        kind: toKind,
        idx: parseInt(portEl.dataset.portIdx),
      };
      // 高亮兼容/不兼容端口
      if (valid) portEl.classList.add('compatible');
      else portEl.classList.add('incompatible');
    }
  }

  workflow.pendingConnection.toX = sx;
  workflow.pendingConnection.toY = sy;
  workflow.pendingConnection.valid = valid;
  workflow.hoveredPort = hovered;
  markEdgesDirty();
});

window.addEventListener('mouseup', (e) => {
  if (!connecting) return;

  // 清除 connecting 状态
  connecting.fromNode.el.querySelectorAll('.node-port.connecting').forEach(p => {
    p.classList.remove('connecting');
  });
  // 清除 compatible/incompatible
  workflow.nodes.forEach(n => {
    n.el.querySelectorAll('.node-port.compatible, .node-port.incompatible').forEach(p => {
      p.classList.remove('compatible', 'incompatible');
    });
  });

  if (workflow.hoveredPort && workflow.pendingConnection.valid) {
    // 确保 from 是 output, to 是 input
    let fromNode, fromIdx, toNode, toIdx;

    if (connecting.fromKind === 'output') {
      fromNode = connecting.fromNode;
      fromIdx = connecting.fromIdx;
      toNode = workflow.hoveredPort.node;
      toIdx = workflow.hoveredPort.idx;
    } else {
      fromNode = workflow.hoveredPort.node;
      fromIdx = workflow.hoveredPort.idx;
      toNode = connecting.fromNode;
      toIdx = connecting.fromIdx;
    }

    // 检查是否已存在相同连线（避免重复）
    let exists = false;
    workflow.edges.forEach(e => {
      if (e.from.node.id === fromNode.id && e.from.port === fromIdx &&
          e.to.node.id === toNode.id && e.to.port === toIdx) {
        exists = true;
      }
    });

    if (!exists) {
      // 允许多条连线连到同一输入端口（支持参考图等多输入场景）
      pushHistory();
      const edge = new Edge(fromNode, fromIdx, toNode, toIdx);
      workflow.edges.set(edge.id, edge);
      updateStatusbar();
      scheduleAutosave();
    }
  }

  connecting = null;
  workflow.pendingConnection = null;
  workflow.hoveredPort = null;
  markEdgesDirty();
});

function addMenuItem(label, icon, shortcut, onClick, isDanger) {
  const item = document.createElement('div');
  item.className = 'context-menu-item' + (isDanger ? ' danger' : '');
  item.innerHTML = `${icon}<span>${label}</span>${shortcut ? `<span class="shortcut">${shortcut}</span>` : ''}`;
  item.addEventListener('click', () => {
    onClick();
    hideContextMenu();
  });
  contextMenu.appendChild(item);
}

function addMenuSeparator() {
  const sep = document.createElement('div');
  sep.className = 'context-menu-separator';
  contextMenu.appendChild(sep);
}

function showContextMenu(x, y, node) {
  contextMenu.innerHTML = '';

  if (node) {
    // —— 节点上下文菜单 ——
    addMenuItem('创建副本', MENU_ICONS.duplicate, 'Ctrl+D', () => duplicateNode(node));
    addMenuItem('删除节点', MENU_ICONS.delete, 'Del', () => deleteNode(node.id), true);
    addMenuSeparator();
    addMenuItem('置于顶层', MENU_ICONS.front, '', () => bringToFront(node));
    addMenuItem('置于底层', MENU_ICONS.back, '', () => sendToBack(node));
    addMenuSeparator();
    if (node.type === 'aiImage' || node.type === 'aiVideo') {
      addMenuItem('运行节点', MENU_ICONS.run, '', () => runNode(node));
    }
  } else {
    // —— 画布上下文菜单 ——
    addMenuItem('适应内容', MENU_ICONS.run, 'Ctrl+Enter', () => runAllNodes());
    addMenuItem('适应内容', MENU_ICONS.fit, 'F', () => fitToContent());
    addMenuItem('重置缩放', MENU_ICONS.zoom, '0', () => resetZoom());
    addMenuSeparator();
    addMenuItem('全选节点', MENU_ICONS.selectAll, 'Ctrl+A', () => selectAllNodes());
    if (workflow.selection.size > 1) {
      addMenuSeparator();
      addMenuItem('左对齐', MENU_ICONS.selectAll, 'Ctrl+Shift+L', () => alignSelected('left'));
      addMenuItem('水平居中', MENU_ICONS.selectAll, 'Ctrl+Shift+C', () => alignSelected('centerX'));
      addMenuItem('右对齐', MENU_ICONS.selectAll, 'Ctrl+Shift+R', () => alignSelected('right'));
      addMenuItem('顶对齐', MENU_ICONS.selectAll, 'Ctrl+Shift+T', () => alignSelected('top'));
      addMenuItem('垂直居中', MENU_ICONS.selectAll, 'Ctrl+Shift+M', () => alignSelected('centerY'));
      addMenuItem('底对齐', MENU_ICONS.selectAll, 'Ctrl+Shift+B', () => alignSelected('bottom'));
      addMenuSeparator();
      addMenuItem('水平分布', MENU_ICONS.selectAll, '', () => distributeSelected('horizontal'));
      addMenuItem('垂直分布', MENU_ICONS.selectAll, '', () => distributeSelected('vertical'));
    }
  }

  // 确保菜单不超出视口
  const menuW = 200;
  const menuH = contextMenu.children.length * 34 + 8;
  let mx = x, my = y;
  if (x + menuW > window.innerWidth) mx = x - menuW;
  if (y + menuH > window.innerHeight) my = y - menuH;

  contextMenu.style.left = mx + 'px';
  contextMenu.style.top = my + 'px';
  contextMenu.classList.add('show');
}

function hideContextMenu() {
  contextMenu.classList.remove('show');
}

function duplicateNode(node) {
  const newNode = addNode(node.type, node.x + 40, node.y + 40, node.thumb);
  newNode.prompt = node.prompt;
  newNode.params = { ...node.params };
  buildNodeBody(newNode.el, newNode);

function bringToFront(node) {
  node.el.style.zIndex = (++workflow.nextZ).toString();
}

function sendToBack(node) {
  let minZ = Infinity;
  workflow.nodes.forEach(n => {
    const z = parseInt(n.el.style.zIndex) || 0;
    if (z < minZ) minZ = z;
  });
  node.el.style.zIndex = (minZ - 1).toString();
}

function resetZoom() {
  workflow.camera.zoom = 1;
  applyTransform();
  markEdgesDirty();
}

function selectAllNodes() {
  workflow.selection.forEach(id => {
    const n = workflow.nodes.get(id);
    if (n && n.el) n.el.classList.remove('selected');
  });
  workflow.selection.clear();
  workflow.nodes.forEach(n => {
    workflow.selection.add(n.id);
    n.el.classList.add('selected');
  });
  updateSelectionUI();
  updateContextToolbar();
}

function init() {
  buildSidebar();
  resizeCanvases();

  // 绑定工具栏按钮
  document.getElementById('btnUndo').onclick = undo;
  document.getElementById('btnRedo').onclick = redo;
  document.getElementById('btnRecycle').onclick = () => toggleRecyclePanel();
  document.getElementById('btnExport').onclick = exportJSON;
  document.getElementById('btnImport').onclick = () => document.getElementById('importFileInput').click();
  document.getElementById('btnClearSave').onclick = () => {
    if (confirm('确定清空已保存数据？这将无法恢复之前自动保存的画布状态。')) {
      clearSavedData();
    }
  };

  // 回收站面板事件
  document.getElementById('recycleClose').onclick = () => toggleRecyclePanel(false);
  document.getElementById('recycleOverlay').onclick = () => toggleRecyclePanel(false);
  document.getElementById('btnRestoreAll').onclick = () => {
    if (recycleBin.length === 0) return;
    if (!confirm('确定还原回收站中的全部节点？')) return;
    // 整个"全部还原"作为单次原子操作，只压入一条撤销历史
    isBatchRestore = true;
    pushHistory(); // 循环前统一压栈一次（捕获还原前状态）
    try {
      // 从后往前还原，避免索引错乱
      for (let i = recycleBin.length - 1; i >= 0; i--) {
        restoreFromRecycle(i);
      }
    } finally {
      isBatchRestore = false; // 确保异常时也能复位标志
    }
  };
  document.getElementById('btnEmptyRecycle').onclick = () => {
    if (!confirm('确定清空回收站？此操作不可撤销。')) return;
    emptyRecycleBin();
  };

  // 导入文件选择
  document.getElementById('importFileInput').onchange = (e) => {
    const file = e.target.files[0];
    if (file) importJSON(file);
    e.target.value = ''; // 重置，允许重复导入同名文件
  };

  // 初始 camera 居中
  workflow.camera.x = canvasWrap.clientWidth / 2;
  workflow.camera.y = canvasWrap.clientHeight / 2;

  // 尝试从 localStorage 恢复
  const restored = restoreFromStorage();

  if (restored !== false && restored > 0) {
    // 有保存数据，恢复成功
    updateStatusbar();
    updateRecycleUI();
    updateUndoRedoButtons();
    applyTransform();
    markEdgesDirty();
    setTimeout(() => fitToContent(), 100);
    setTimeout(() => {
      showToast(`已恢复 ${restored} 个节点`, 'success');
    }, 300);
  } else {
    // 无保存数据，创建示例节点
    createExampleNodes();
  }
}

// ---------- 框选（Marquee Selection） ----------
const marqueeRect = document.createElement('div');
marqueeRect.className = 'marquee-rect';
canvasWrap.appendChild(marqueeRect);

const marquee = { active: false, startX: 0, startY: 0, curX: 0, curY: 0 };

function startMarquee(e) {
  const rect = canvasWrap.getBoundingClientRect();
  marquee.active = true;
  marquee.startX = e.clientX - rect.left;
  marquee.startY = e.clientY - rect.top;
  marquee.curX = marquee.startX;
  marquee.curY = marquee.startY;
  updateMarqueeRect();
}

function updateMarqueeRect() {
  if (!marquee.active) return;
  const x = Math.min(marquee.startX, marquee.curX);
  const y = Math.min(marquee.startY, marquee.curY);
  const w = Math.abs(marquee.curX - marquee.startX);
  const h = Math.abs(marquee.curY - marquee.startY);
  marqueeRect.style.left = x + 'px';
  marqueeRect.style.top = y + 'px';
  marqueeRect.style.width = w + 'px';
  marqueeRect.style.height = h + 'px';
  marqueeRect.style.display = (w > 3 || h > 3) ? 'block' : 'none';
}

function endMarquee() {
  marquee.active = false;
  marqueeRect.style.display = 'none';
  const w = Math.abs(marquee.curX - marquee.startX);
  const h = Math.abs(marquee.curY - marquee.startY);
  if (w <= 3 && h <= 3) return; // 阈值内视为普通点击

  // 画布世界坐标下的选区
  const p1 = workflow.camera.screenToWorld(Math.min(marquee.startX, marquee.curX), Math.min(marquee.startY, marquee.curY));
  const p2 = workflow.camera.screenToWorld(Math.max(marquee.startX, marquee.curX), Math.max(marquee.startY, marquee.curY));
  const selX = Math.min(p1.x, p2.x), selY = Math.min(p1.y, p2.y);
  const selW = Math.abs(p2.x - p1.x), selH = Math.abs(p2.y - p1.y);

  workflow.nodes.forEach(n => {
    const intersects = n.x < selX + selW && n.x + n.width > selX && n.y < selY + selH && n.y + n.height > selY;
    setNodeSelected(n, intersects);
  });
}

window.addEventListener('mousemove', (e) => {
  if (marquee.active) {
    const rect = canvasWrap.getBoundingClientRect();
    marquee.curX = e.clientX - rect.left;
    marquee.curY = e.clientY - rect.top;
    updateMarqueeRect();
  }
});

// ---------- 批量复制 ----------
function duplicateSelection() {
  if (workflow.selection.size === 0) return;
  pushHistory();
  const selected = [...workflow.selection].map(id => workflow.nodes.get(id)).filter(Boolean);
  if (selected.length === 0) return;
  const copies = selected.map(n => {
    const copy = new WorkflowNode(n.type, n.x + 40, n.y + 40, n.thumb);
    copy.prompt = n.prompt;
    copy.params = { ...n.params };
    const el = createNodeElement(copy);
    nodeLayer.appendChild(el);
    workflow.nodes.set(copy.id, copy);
    workflow.order.push(copy.id);
    return copy;
  });
  // 复制选中节点内部的连线
  const selectedIds = new Set(selected.map(n => n.id));
  const copyMap = new Map();
  selected.forEach((n, i) => copyMap.set(n.id, copies[i]));
  workflow.edges.forEach(e => {
    if (selectedIds.has(e.from.node.id) && selectedIds.has(e.to.node.id)) {
      const edge = new Edge(copyMap.get(e.from.node.id), e.from.port, copyMap.get(e.to.node.id), e.to.port);
      workflow.edges.set(edge.id, edge);
    }
  });
  clearSelection();
  copies.forEach(cp => setNodeSelected(cp, true));
  updateStatusbar();
  minimapInvalidate();
  markEdgesDirty();
  scheduleAutosave();
  showToast('已复制 ' + copies.length + ' 个节点', 'success');
}

// ---------- 对齐与分布 ----------
function selectedNodesArr() {
  return [...workflow.selection].map(id => workflow.nodes.get(id)).filter(Boolean);
}

function alignSelected(alignType) {
  const nodes = selectedNodesArr();
  if (nodes.length < 2) return;
  pushHistory();
  if (alignType === 'left' || alignType === 'centerX' || alignType === 'right') {
    const xs = nodes.map(n => n.x);
    const rightXs = nodes.map(n => n.x + n.width);
    const target = alignType === 'left' ? Math.min(...xs)
      : alignType === 'right' ? Math.max(...rightXs)
      : Math.min(...xs) + (Math.max(...rightXs) - Math.min(...xs)) / 2;
    nodes.forEach(n => {
      if (alignType === 'left') n.x = target;
      else if (alignType === 'right') n.x = target - n.width;
      else n.x = target - n.width / 2;
    });
  } else {
    const ys = nodes.map(n => n.y);
    const bottomYs = nodes.map(n => n.y + n.height);
    const target = alignType === 'top' ? Math.min(...ys)
      : alignType === 'bottom' ? Math.max(...bottomYs)
      : Math.min(...ys) + (Math.max(...bottomYs) - Math.min(...ys)) / 2;
    nodes.forEach(n => {
      if (alignType === 'top') n.y = target;
      else if (alignType === 'bottom') n.y = target - n.height;
      else n.y = target - n.height / 2;
    });
  }
  refreshNodePositions(nodes);
  scheduleAutosave();
}

function distributeSelected(distType) {
  const nodes = selectedNodesArr();
  if (nodes.length < 3) return;
  pushHistory();
  const sorted = [...nodes];
  if (distType === 'horizontal') {
    sorted.sort((a, b) => a.x - b.x);
    const first = sorted[0], last = sorted[sorted.length - 1];
    const gap = (last.x - first.x) / (sorted.length - 1);
    sorted.forEach((n, i) => { n.x = first.x + gap * i; });
  } else {
    sorted.sort((a, b) => a.y - b.y);
    const first = sorted[0], last = sorted[sorted.length - 1];
    const gap = (last.y - first.y) / (sorted.length - 1);
    sorted.forEach((n, i) => { n.y = first.y + gap * i; });
  }
  refreshNodePositions(sorted);
  scheduleAutosave();
}

function refreshNodePositions(nodes) {
  nodes.forEach(n => {
    if (n.el) {
      n.el.style.left = n.x + 'px';
      n.el.style.top = n.y + 'px';
    }
  });
  updateSelectionUI();
  markEdgesDirty();
  minimapInvalidate();
}

function nudgeSelection(dx, dy) {
  if (workflow.selection.size === 0) return;
  pushHistory();
  const nodes = selectedNodesArr();
  nodes.forEach(n => { n.x += dx; n.y += dy; });
  refreshNodePositions(nodes);
  scheduleAutosave();
}

// ---------- 缩略图导航（Minimap） ----------
const minimapEl = document.createElement('div');
minimapEl.className = 'canvas-minimap';
minimapEl.innerHTML = '<canvas></canvas>';
canvasWrap.appendChild(minimapEl);
const minimapCanvas = minimapEl.querySelector('canvas');
const minimapCtx = minimapCanvas.getContext('2d');
let minimapDirty = true;

function minimapInvalidate() {
  const mm = document.querySelector('.canvas-minimap');
  if (mm) mm.dataset.dirty = '1';
}

function getContentBounds() {
  if (workflow.nodes.size === 0) return null;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  workflow.nodes.forEach(n => {
    minX = Math.min(minX, n.x);
    minY = Math.min(minY, n.y);
    maxX = Math.max(maxX, n.x + n.width);
    maxY = Math.max(maxY, n.y + n.height);
  });
  return { minX, minY, maxX, maxY };
}

function drawMinimap() {
  const mmEl = document.querySelector('.canvas-minimap');
  if (!mmEl) return;
  const mmCv = mmEl.querySelector('canvas');
  if (!mmCv) return;
  const mmCtx = mmCv.getContext('2d');
  const bounds = getContentBounds();
  mmEl.style.display = bounds ? 'block' : 'none';
  if (!bounds) return;
  const isDirty = mmEl.dataset.dirty === '1' || !mmEl.dataset.dirty;
  if (!isDirty && !panning && !marquee.active) return;
  mmEl.dataset.dirty = '0';

  const dpr = window.devicePixelRatio || 1;
  const cw = mmEl.clientWidth, ch = mmEl.clientHeight;
  mmCv.width = cw * dpr;
  mmCv.height = ch * dpr;
  mmCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  mmCtx.clearRect(0, 0, cw, ch);

  const pad = 12;
  const bw = bounds.maxX - bounds.minX, bh = bounds.maxY - bounds.minY;
  if (bw <= 0 || bh <= 0) return;
  const s = Math.min((cw - pad * 2) / bw, (ch - pad * 2) / bh);
  const ox = (cw - bw * s) / 2 - bounds.minX * s;
  const oy = (ch - bh * s) / 2 - bounds.minY * s;

  mmCtx.fillStyle = 'rgba(11,13,17,0.9)';
  mmCtx.fillRect(0, 0, cw, ch);

  workflow.nodes.forEach(n => {
    const nx = n.x * s + ox, ny = n.y * s + oy;
    const nw = Math.max(2, n.width * s), nh = Math.max(2, n.height * s);
    mmCtx.fillStyle = (n.def && n.def.colorRaw) ? n.def.colorRaw : '#9AA0A8';
    mmCtx.globalAlpha = workflow.selection.has(n.id) ? 1 : 0.55;
    mmCtx.fillRect(nx, ny, nw, nh);
    mmCtx.globalAlpha = 1;
  });

  const cam = workflow.camera;
  const vx = (-cam.x / cam.zoom) * s + ox;
  const vy = (-cam.y / cam.zoom) * s + oy;
  const vw = (canvasWrap.clientWidth / cam.zoom) * s;
  const vh = (canvasWrap.clientHeight / cam.zoom) * s;
  mmCtx.strokeStyle = '#5B8DEF';
  mmCtx.lineWidth = 1.5;
  mmCtx.strokeRect(vx, vy, vw, vh);

  minimapDirty = false;
}

// 点击 / 拖拽缩略图 -> 平移画布
minimapEl.addEventListener('mousedown', (e) => {
  e.preventDefault();
  e.stopPropagation();
  minimapNavigate(e);
  const onMove = (e2) => minimapNavigate(e2);
  const onUp = () => {
    window.removeEventListener('mousemove', onMove);
    window.removeEventListener('mouseup', onUp);
  };
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
});

function minimapNavigate(e) {
  const bounds = getContentBounds();
  if (!bounds) return;
  const rect = minimapEl.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const cw = rect.width, ch = rect.height;
  const pad = 12;
  const bw = bounds.maxX - bounds.minX, bh = bounds.maxY - bounds.minY;
  if (bw <= 0 || bh <= 0) return;
  const s = Math.min((cw - pad * 2) / bw, (ch - pad * 2) / bh);
  const ox = (cw - bw * s) / 2 - bounds.minX * s;
  const oy = (ch - bh * s) / 2 - bounds.minY * s;
  const worldX = (mx - ox) / s;
  const worldY = (my - oy) / s;
  workflow.camera.x = canvasWrap.clientWidth / 2 - worldX * workflow.camera.zoom;
  workflow.camera.y = canvasWrap.clientHeight / 2 - worldY * workflow.camera.zoom;
  applyTransform();
  markEdgesDirty();
}

// 空画布时初始隐藏缩略图
if (workflow.nodes.size === 0) minimapEl.style.display = 'none';

// ---------- 钩子（供旧代码调用） ----------

//=============================================================================
// v2.2 新增：运行引擎 / 主题切换 / 视口裁剪 / 图片上传
//=============================================================================
let runningFlow = false;

const RUN_DELAYS = {
  image: 600, text: 600, aiImage: 1200, aiVideo: 1200,
  upscale: 900, compare: 900, save: 600
};

// ---------- 运行引擎 ----------
function runAllNodes() {
  if (runningFlow) { showToast('工作流正在运行中…', 'info'); return; }
  const order = [];
  const visited = new Set();
  const visit = (id) => {
    if (visited.has(id)) return;
    visited.add(id);
    workflow.edges.forEach(e => { if (e.from.node.id === id) visit(e.to.node.id); });
    order.push(id);
  };
  workflow.nodes.forEach(n => visit(n.id));
  runFlow(order);
}

// 从指定节点出发，沿连线做拓扑排序（先依赖后依赖者）
function topoOrderFrom(startId) {
  const start = workflow.nodes.get(startId);
  if (!start) return [];
  const order = [];
  const visited = new Set();
  const visit = (id) => {
    if (visited.has(id)) return;
    visited.add(id);
    workflow.edges.forEach(e => { if (e.from.node.id === id) visit(e.to.node.id); });
    order.push(id);
  };
  visit(startId);
  return order;
}

// 顺序执行引擎
function runFlow(order) {
  if (runningFlow) return;
  const nodes = order.map(id => workflow.nodes.get(id)).filter(Boolean);
  if (!nodes.length) { showToast('没有可运行的节点', 'info'); return; }
  runningFlow = true;
  canvasWrap.classList.add('canvas-running');
  nodes.forEach(n => { n.status = 'idle'; updateNodeStatus(n); });
  let i = 0;
  const runNext = () => {
    if (i >= nodes.length) {
      runningFlow = false;
      canvasWrap.classList.remove('canvas-running');
      showToast('运行完成（' + nodes.length + ' 个节点）', 'success');
      scheduleAutosave();
      return;
    }
    const node = nodes[i++];
    node.status = 'running';
    updateNodeStatus(node);
    const delay = RUN_DELAYS[node.type] || 800;
    setTimeout(() => {
      try {
        executeNode(node);
        node.status = 'done';
      } catch (err) {
        node.status = 'error';
        showToast(node.title + ' 运行失败', 'error');
      }
      updateNodeStatus(node);
      runNext();
    }, delay);
  };
  runNext();
}

// 单节点执行逻辑：AI 生成占位图；处理/保存类取上游图片
function executeNode(node) {
  let src = null;
  workflow.edges.forEach(e => {
    if (!src && e.to.node.id === node.id) src = e.from.node;
  });
  if (node.type === 'aiImage' || node.type === 'aiVideo') {
    node.thumb = makePlaceholder(node.type, node.id);
    rebuildNodeBody(node);
    return;
  }
  if (node.type === 'upscale' || node.type === 'compare' || node.type === 'save') {
    if (src && src.thumb) {
      node.thumb = src.thumb;
      rebuildNodeBody(node);
      if (node.type === 'save') {
        addSaveDownloadBtn(node);
        downloadImage(node.thumb, 'flowcraft-' + node.id + '.png');
      }
    } else if (node.type === 'save') {
      showToast('保存节点未收到上游图片', 'info');
    }
  }
}

function rebuildNodeBody(node) {
  if (node.el) {
    buildNodeBody(node.el, node);
    markEdgesDirty();
  }
}

// 保存节点：收到图片后提供下载按钮
function addSaveDownloadBtn(node) {
  if (node.type !== 'save' || !node.el) return;
  const thumb = node.el.querySelector('.node-thumb');
  if (!thumb || thumb.querySelector('.thumb-download')) return;
  const btn = document.createElement('button');
  btn.className = 'thumb-download';
  btn.title = '下载图片';
  btn.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v8M5 7l3 3 3-3M3 13h10"/></svg>';
  btn.onclick = (e) => {
    e.stopPropagation();
    downloadImage(node.thumb, 'flowcraft-' + node.id + '.png');
  };
  btn.onmousedown = (e) => e.stopPropagation();
  thumb.appendChild(btn);
}

async function downloadImage(url, filename) {
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('fetch failed');
    const blob = await res.blob();
    const objUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = objUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(objUrl), 5000);
    return true;
  } catch (err) {
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    return false;
  }
}

// ---------- 图片上传 ----------
function openImageUpload(node) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.style.display = 'none';
  document.body.appendChild(input);
  input.addEventListener('change', () => {
    const file = input.files && input.files[0];
    input.remove();
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      node.uploadedImage = reader.result;
      node.thumb = reader.result;
      if (node.el) {
        buildNodeBody(node.el, node);
        markEdgesDirty();
      }
      scheduleAutosave();
      showToast('图片已上传', 'success');
    };
    reader.readAsDataURL(file);
  });
  input.click();
}

// ---------- 占位图 ----------
function makePlaceholder(type, id) {
  const seed = 'flowcraft-' + type + '-' + id;
  const w = 48;
  const h = type === 'aiVideo' ? 32 : 48;
  return 'https://picsum.photos/seed/' + seed + '/' + w + '/' + h;
}

// ---------- 主题切换 ----------
function toggleTheme() {
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  if (isLight) {
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('flowcraft:theme', 'dark');
  } else {
    document.documentElement.setAttribute('data-theme', 'light');
    localStorage.setItem('flowcraft:theme', 'light');
  }
  applyTransform();
  markEdgesDirty();
  showToast(isLight ? '已切换深色主题' : '已切换浅色主题', 'info');
}

// ---------- 视口裁剪 ----------
function updateVisibleNodes() {
  if (!workflow || !workflow.nodes) return;
  const cam = workflow.camera;
  const cw = canvasWrap.clientWidth;
  const ch = canvasWrap.clientHeight;
  const wl = (0 - cam.x) / cam.zoom;
  const wt = (0 - cam.y) / cam.zoom;
  const wr = (cw - cam.x) / cam.zoom;
  const wb = (ch - cam.y) / cam.zoom;
  const pad = 120;
  workflow.nodes.forEach(n => {
    if (!n.el) return;
    // 拖拽/选中中的节点始终保留，避免操作中断
    if (n.el.classList.contains('dragging') || n.el.classList.contains('selected')) {
      n.el.classList.remove('node-culled');
      return;
    }
    const nx = n.x, ny = n.y;
    const nw = n.width || 280, nh = n.height || 200;
    const visible = (nx + nw > wl - pad) && (nx < wr + pad) && (ny + nh > wt - pad) && (ny < wb + pad);
    n.el.classList.toggle('node-culled', !visible);
  });
}

// 选中状态变化时同步裁剪（选中节点必须可见）
updateSelectionUI = () => { updateVisibleNodes(); };
// 拖拽结束后重新计算裁剪
window.addEventListener('mouseup', () => { updateVisibleNodes(); });

// 恢复上次主题
if (localStorage.getItem('flowcraft:theme') === 'light') {
  document.documentElement.setAttribute('data-theme', 'light');
  applyTransform();
  markEdgesDirty();
}
